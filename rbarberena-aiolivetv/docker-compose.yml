services:
  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: rbarberena-aiolivetv_aiolivetv_1
      APP_PORT: 3000

  aiolivetv:
    image: ghcr.io/mrcanelas/aiolivetv:v1.9.0@sha256:5f070362a0e6f89c309b88f9de27efbf87496e8f49f3b1597a9a3b212bc41c05
    restart: unless-stopped
    environment:
      # Goes into every manifest and stream link the Apple TV receives, so it
      # must be an address the Apple TV reaches without Umbrel's login: the
      # published port below, on the Umbrel's LAN IP. Change it here if the
      # Umbrel's IP ever changes.
      - BASE_URL=http://192.168.1.100:8296
      # Encrypts stored configs (your Xtream login) and must never change.
      # APP_SEED is Umbrel's stable per-app 256-bit hex secret: 64 hex chars,
      # exactly what AIOLiveTV requires.
      - SECRET_KEY=${APP_SEED}
      - DATABASE_URI=sqlite://./data/db.sqlite

      # --- Get past ISP blocks (LaLiga Cloudflare blocks hit IPTV too) ---
      # Login for the configure page and the built-in stream proxy. Umbrel
      # shows these credentials in the app's info (defaultPassword).
      - AIOLIVETV_AUTH=umbrel:${APP_PASSWORD}
      # 1) Channel lists: the Xtream SDK uses Node's global fetch, which only
      #    goes through a proxy with NODE_USE_ENV_PROXY.
      - NODE_USE_ENV_PROXY=1
      - HTTP_PROXY=http://warp:1080
      - HTTPS_PROXY=http://warp:1080
      - NO_PROXY=localhost,127.0.0.1
      # 2) Video: the Apple TV can't reach a blocked provider either, so every
      #    stream is forced through the built-in proxy (Apple TV -> here), and
      #    that proxy's upstream requests go out via ADDON_PROXY (here -> WARP
      #    -> provider). Empty proxied-services list = proxy everything.
      - ADDON_PROXY=http://warp:1080
      - FORCE_PROXY_ENABLED=true
      - FORCE_PROXY_ID=builtin
      - FORCE_PROXY_URL=http://192.168.1.100:8296
      - FORCE_PROXY_CREDENTIALS=umbrel:${APP_PASSWORD}
    depends_on:
      - warp
    # Published on the host, not only behind app_proxy: the Apple TV fetches
    # the addon from here and can't pass Umbrel's login.
    ports:
      - "8296:3000"
    volumes:
      - ${APP_DATA_DIR}/data:/app/data

  warp:
    # Same WARP proxy as the TorrServer app, kept per-app so neither app
    # depends on the other being installed. Only reachable inside this app.
    image: caomingjun/warp:2026.8.2115.0-2.12.0@sha256:2891b92420a193a49c74cbd4387bee91f5c35fbc487fca8e8f739baed52c1d2b
    restart: unless-stopped
    environment:
      - WARP_SLEEP=2
    # /dev/net/tun for the WARP tunnel (upstream README).
    device_cgroup_rules:
      - "c 10:200 rwm"
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ${APP_DATA_DIR}/data/warp:/var/lib/cloudflare-warp
