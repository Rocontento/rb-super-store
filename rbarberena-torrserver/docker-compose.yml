services:
  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: rbarberena-torrserver_torrserver_1
      APP_PORT: 8090

  torrserver:
    image: ghcr.io/yourok/torrserver:MatriX.151@sha256:6adc851f5ce2f523b6b95998f1fdb1e172deef1c001c1419abcdc5788d77be5a
    restart: unless-stopped
    environment:
      - TZ=Europe/Madrid
    # Published on the host, not only behind app_proxy: the Apple TV plays
    # straight from here and can't pass Umbrel's login.
    ports:
      - "8293:8090"
    volumes:
      - ${APP_DATA_DIR}/data/config:/opt/ts/config

  addon:
    # Node 24: built-in fetch honours HTTPS_PROXY with NODE_USE_ENV_PROXY.
    image: node:24-alpine@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5
    restart: unless-stopped
    depends_on:
      - warp
    # Zero-dependency script shipped with the app, so no image to build.
    command: ["node", "/app/server.js"]
    environment:
      - PORT=8294
      # Host port TorrServer is published on (above). The addon builds stream
      # links with the same host the client used to reach it.
      - TORRSERVER_PORT=8293
      # The addon's only outbound request is to Torrentio, which Spanish ISPs
      # block on LaLiga match days (Cloudflare IP blocks). Going through WARP
      # keeps that request inside Cloudflare's network. Torrent traffic itself
      # comes from TorrServer and does not use this.
      - NODE_USE_ENV_PROXY=1
      - HTTPS_PROXY=http://warp:1080
    ports:
      - "8294:8294"
    volumes:
      - ${APP_DATA_DIR}/addon:/app:ro

  warp:
    # Official Cloudflare WARP client + GOST, exposing an HTTP/SOCKS5 proxy on
    # :1080 inside the app network only (not published on the host).
    image: caomingjun/warp:2026.8.2115.0-2.12.0@sha256:2891b92420a193a49c74cbd4387bee91f5c35fbc487fca8e8f739baed52c1d2b
    restart: unless-stopped
    environment:
      - WARP_SLEEP=2
    # /dev/net/tun for the WARP tunnel (upstream README).
    device_cgroup_rules:
      - "c 10:200 rwm"
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      # WARP registration, so it isn't re-registered on every restart.
      - ${APP_DATA_DIR}/data/warp:/var/lib/cloudflare-warp
