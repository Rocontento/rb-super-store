manifestVersion: 1.1
id: rbarberena-chromium-browser
name: Chromium
tagline: Un navegador Chromium completo dentro de tu navegador
category: networking
version: "8d3cb5f1"
port: 5800
description: >-
  Chromium es el proyecto de navegador de código abierto en el que se basan
  Google Chrome, Microsoft Edge, Brave y Opera.


  Esta app ejecuta un escritorio Chromium real dentro de tu Umbrel y te lo
  entrega en tu propio navegador, así que puedes usarlo desde cualquier
  ordenador, tablet o móvil de tu red sin instalar nada.


  ¿Para qué sirve?


  - Navegar desde la IP de tu Umbrel en lugar de la de tu dispositivo.

  - Abrir paneles de la red local (routers, cámaras, Home Assistant) sin salir
    de tu red.

  - Mantener sesiones abiertas 24/7 en un equipo que siempre está encendido.

  - Aislar la navegación del resto de tus dispositivos.


  El perfil, los marcadores, las extensiones y las sesiones se guardan en el
  disco de tu Umbrel, así que sobreviven a los reinicios y a las
  actualizaciones de la app.


  Notas


  - Usa la misma imagen que la app oficial de Chromium de Umbrel, anclada al
    mismo build (linuxserver 8d3cb5f1). Es el último que se renderiza bien
    sobre HTTP plano, que es como umbrelOS sirve las apps. Los builds
    posteriores exigen HTTPS para WebCodecs y se quedan en negro.

  - Al estar anclada a ese build, esta app NO recibe actualizaciones de
    seguridad de Chromium. Tenlo en cuenta antes de usarla para navegar por
    sitios que no controlas.

  - El vídeo y el audio pueden ir limitados por esa misma razón: sin HTTPS no
    hay WebCodecs y el streaming cae a un modo menos eficiente.

  - Chromium tiene acceso completo a tu red local. Instálalo solo si confías en
    quien tiene acceso a tu Umbrel.
developer: The Chromium Project
