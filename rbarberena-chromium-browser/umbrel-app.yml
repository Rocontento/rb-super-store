releaseNotes: >-
  Primera versión de esta app.


  Reemplaza la app de Chromium anterior, que estaba basada en una imagen
  KasmVNC y no funcionaba bien detrás del proxy HTTP de umbrelOS.


  - Imagen jlesage/chromium con interfaz web noVNC, que sí funciona sobre HTTP.

  - Audio del navegador transmitido a la pestaña.

  - 1 GB de memoria compartida para que YouTube y otras webs con vídeo no
    tumben el navegador.

  - Modo oscuro y reinicio automático de Chromium activados.

  - Imagen anclada por digest para que las actualizaciones sean reproducibles.
