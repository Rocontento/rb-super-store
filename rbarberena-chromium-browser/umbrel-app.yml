releaseNotes: >-
  Cambia la imagen a linuxserver/chromium, la misma que usa la app oficial de
  Chromium de Umbrel.


  La versión anterior de esta app usaba jlesage/chromium, cuyo binario de
  Chromium (base Alpine) moría con SIGILL en algunas CPUs y dejaba la pantalla
  en negro. Este es un build distinto, con base Debian.


  - Imagen anclada por digest, igual que en la app oficial.

  - 1 GB de memoria compartida para que las webs con vídeo no tumben el
    navegador.

  - IMPORTANTE: si venías de la versión anterior, desinstala la app antes de
    instalar esta. El perfil que quedó en disco es de otra imagen y no es
    compatible.
