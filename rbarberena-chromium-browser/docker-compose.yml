version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: rbarberena-chromium-browser_chromium_1
      APP_PORT: 3000

  chromium:
    # Mirrors getumbrel/umbrel-apps/chromium. Pinned to the last linuxserver
    # build that still renders over plain HTTP, which is how umbrelOS serves
    # apps. Newer tags require HTTPS for WebCodecs and show a black screen.
    image: ghcr.io/linuxserver/chromium:version-8d3cb5f1@sha256:d7c5f7faf5fe524117fd73c4d446e1bf81bccd0d64d073a30b8c9819fdf105d6
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      # Profile, bookmarks, extensions and settings live here.
      - ${APP_DATA_DIR}/data:/config
    # Chromium crashes on media-heavy sites with Docker's default 64 MB.
    shm_size: "1gb"
    restart: on-failure
