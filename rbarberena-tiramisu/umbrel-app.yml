releaseNotes: >-
  Dos arreglos de reproducción: bajar "Master Concurrency" por debajo de 5 ya
  no bloquea toda reproducción nueva para siempre (una cuenta interna se
  volvía negativa y denegaba el streaming sin parar); y los torrents con
  varios archivos (muestra, NFO, subtítulos antes que el vídeo) ya no fallan
  con "file with id 0 not found" — ahora elige el archivo de vídeo más grande
  si no hay forma de saber el índice de antemano.


  La carpeta virtual (la que ve Plex/Jellyfin) ahora vive en
  ~/umbrel/home/Downloads/Tiramisu en vez de en el app-data privado de esta
  app. Antes, si movías el origen de los archivos a un disco externo con
  "Advanced folder access", el montaje FUSE nunca llegaba a salir de este
  contenedor — esa UI siempre monta con propagación privada, así que
  cualquier otra app se quedaba viendo esa carpeta vacía para siempre, sin
  importar cuánto esperase. Al vivir en Downloads, que Plex ya monta de
  fábrica, esto ya no depende de compartir carpetas a mano.


  WatchlistSync y TVSync (episodios sueltos) reciben el mismo tratamiento
  perezoso que MovieSync: nada de abrir torrents reales durante el sync, solo
  al darle al play. Los packs de temporada siguen verificando en el sync porque
  no hay forma de saber qué episodio es cada archivo sin la lista real del
  torrent.


  Arreglado además un bug que borraba la librería entera: el limpiador de
  huérfanos de Movies trataba "no conectado ahora mismo en GoStorm" como
  "huérfano y borrable", pero con el sync perezoso eso es el estado normal de
  reposo, no una señal de que algo desapareció. Ahora solo registra en el log,
  no borra nada.


  Ahora corre la imagen del fork (github.com/Rocontento/tiramisu) en vez de la
  original: MovieSync ya no abre torrents reales durante el sync (solo mira
  metadata del indexador), y verifica/hace fallback a otra release al momento
  de darle al play si la primera no responde en ~25s. Esto es lo que evitaba
  el OOM del contenedor cuando corría el sync automático.


  Primera versión de Tiramisu empaquetada para Umbrel, anclada a la v1.9.43 por
  digest.


  - Configuración persistente en el disco de la app: el config.json se monta en
    lectura/escritura para que los cambios del panel de control sobrevivan a
    los reinicios.

  - Estado del motor de torrents, logs y la carpeta de origen también
    persistidos, en lugar de vivir dentro del contenedor.

  - El montaje FUSE se propaga al host (rshared) para que Plex y Jellyfin
    puedan leer los .mkv virtuales.
