releaseNotes: >-
  Primera versión de Tiramisu empaquetada para Umbrel, anclada a la v1.9.43 por
  digest.


  - Configuración persistente en el disco de la app: el config.json se monta en
    lectura/escritura para que los cambios del panel de control sobrevivan a
    los reinicios.

  - Estado del motor de torrents, logs y la carpeta de origen también
    persistidos, en lugar de vivir dentro del contenedor.

  - El montaje FUSE se propaga al host (rshared) para que Plex y Jellyfin
    puedan leer los .mkv virtuales.
