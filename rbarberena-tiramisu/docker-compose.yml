services:
  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: rbarberena-tiramisu_tiramisu_1
      APP_PORT: 9080

  tiramisu:
    # Built from https://github.com/Rocontento/tiramisu (fork) by its own
    # docker-publish.yml, which pushes to GHCR under this account on every
    # push to main. Not pinned by digest like the upstream image was: this
    # tracks the fork's latest build on purpose. Re-pin to a digest once the
    # fork settles, the way upstream does, to stop an in-place `latest` from
    # changing what's running without a deliberate update.
    image: ghcr.io/rocontento/tiramisu:latest
    restart: unless-stopped

    # The whole product is a FUSE filesystem, so the container needs the FUSE
    # device plus SYS_ADMIN to mount it. NET_ADMIN is for the torrent engine's
    # NAT-PMP / iptables port-forwarding helper.
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - apparmor:unconfined

    # Hard ceiling. Without it a sync run can take the whole Umbrel down with
    # it: GoStorm caches up to 128 MB of RAM per active torrent, and a Plex
    # library scan opens enough files at once to keep ~20 of them hot. With a
    # limit the kernel kills tiramisu alone and the container comes back,
    # instead of the host OOM killer picking a victim among all your apps.
    #
    # Sized for the smallest box umbrelOS runs on: 4 GB total, sitting around
    # 80% used with umbrelOS, Docker and a media server before tiramisu asks
    # for anything. Raise it on a bigger box - this is a cap, not a
    # reservation, but a cap above what the host can spare buys nothing.
    mem_limit: ${TIRAMISU_MEM_LIMIT:-700m}

    environment:
      # Soft limit on the Go heap: it makes the GC work harder as it gets
      # close, so tiramisu mostly stays under mem_limit instead of being
      # killed at it. Keep it well below mem_limit - the process also needs
      # room for stacks, mmap and the FUSE buffers, which are not heap.
      - GOMEMLIMIT=${TIRAMISU_GOMEMLIMIT:-448MiB}
      - GOGC=100
      # The image defaults these to /usr/local, which is not persisted.
      - MKV_PROXY_CONFIG_PATH=/config.json
      - TIRAMISU_ROOT_PATH=/data
      - TIRAMISU_STATE_DIR=/data/STATE
      - TIRAMISU_LOG_DIR=/data/logs
      - TIRAMISU_SOURCE_PATH=/mnt/tiramisu-mkv-real
      - TIRAMISU_MOUNT_PATH=/mnt/tiramisu-mkv-virtual
      # Printed in the logs when the mount goes stale, to tell the user which
      # host path to `umount -l`.
      - TIRAMISU_HOST_MOUNT_HINT=${UMBREL_ROOT}/home/Downloads/Tiramisu

    volumes:
      # Mounted read-write on purpose: the Control Panel saves settings back
      # into this file. Shipped with the store so it exists on first boot.
      - ${APP_DATA_DIR}/data/config.json:/config.json
      # Torrent DB, bans, blocklist cache and logs.
      - ${APP_DATA_DIR}/data/state:/data
      # The .mkv stubs the library is built from.
      - ${APP_DATA_DIR}/data/real:/mnt/tiramisu-mkv-real
      # The FUSE mount itself, backed by the shared Home/Downloads folder
      # (same one Plex's own official app already mounts at /downloads) instead
      # of this app's private app-data. rshared propagates the live FUSE mount
      # out to the host so other containers can read it; without it, whoever
      # else is looking at this same folder just sees it empty forever, however
      # long they wait — a plain bind mount (like Plex's own /downloads one)
      # never picks up a *new mount* layered on top of it after the fact,
      # only content changes to what was already there. Using Home/Downloads
      # rather than app-data means Plex/Jellyfin need no extra folder grant at
      # all: it's a folder they already have by default, not one a user has to
      # discover and share manually via Advanced folder access — which, as
      # configured through that UI, is always rprivate and can't do this job.
      # Short syntax is mandatory: umbreld's compose patcher calls .replace()
      # on every volumes entry and crashes on the long (mapping) form.
      - ${UMBREL_ROOT}/home/Downloads/Tiramisu:/mnt/tiramisu-mkv-virtual:rshared
