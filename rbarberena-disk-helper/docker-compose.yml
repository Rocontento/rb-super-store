version: "3.7"

services:
  # Proxy de Umbrel: pone el panel detras del login de Umbrel
  app_proxy:
    environment:
      APP_HOST: rbarberena-disk-helper_disk-helper_1
      APP_PORT: 8790

  disk-helper:
    # Imagen fijada (como las apps oficiales): una actualizacion de Umbrel no trae otra Debian sin querer
    image: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    restart: unless-stopped
    # Necesario para montar el SSD y vigilar la memoria y los discos del SERVIDOR.
    # Da acceso root total al host: revisar lib.sh y cgi-bin/action antes de cambiar nada.
    privileged: true
    pid: host
    volumes:
      # El codigo vive en hooks/ porque las actualizaciones de Umbrel solo copian
      # docker-compose.yml, umbrel-app.yml y la carpeta hooks/ (ver app-script de umbreld)
      - ${APP_DATA_DIR}/hooks/disk-helper:/app:ro
      - ${APP_DATA_DIR}/data:/data
    command: ["sh", "/app/start.sh"]
